<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" id="tc" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Store Studio">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--tx:#1f1f1f;--mut:#5f6368;--bd:#e0e3e7;--sf:#f1f3f4;--a1:#01875f;--a2:#4285f4;--a3:#fbbc04;--onp:#fff;--sh:0 1px 4px #0003}
[data-theme=dark]{--bg:#131314;--card:#1e1f20;--tx:#e3e3e3;--mut:#9aa0a6;--bd:#3c4043;--sf:#2a2b2d;--a1:#3ddc97;--a2:#8ab4f8;--a3:#fdd663;--onp:#00391f;--sh:0 1px 4px #000a}
[data-theme=medio]{--bg:#3b4260;--card:#4a5275;--tx:#f2f4ff;--mut:#c3c9e6;--bd:#5d6690;--sf:#4f5880;--a1:#ffb454;--a2:#7fc8ff;--a3:#5fe0c0;--onp:#3b2a00;--sh:0 1px 4px #0005}
[data-theme=crema]{--bg:#fbf3e4;--card:#fffaf0;--tx:#4a3426;--mut:#8f7660;--bd:#ecdcc0;--sf:#f3e6cc;--a1:#c2410c;--a2:#d4a017;--a3:#e07a3f;--onp:#fff;--sh:0 1px 4px #4a342633}
[data-theme=loto]{--bg:#fdeef6;--card:#fff8fc;--tx:#4a1d4e;--mut:#9a6a9f;--bd:#f4cfe6;--sf:#fadcec;--a1:#c026d3;--a2:#ff7eb6;--a3:#a78bfa;--onp:#fff;--sh:0 1px 4px #4a1d4e33}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Google Sans",Roboto,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px;display:flex;gap:12px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;margin-right:auto}
.logo i{width:32px;height:32px;border-radius:9px;background:conic-gradient(from 200deg,#34a853,#4285f4,#ea4335,#fbbc04,#34a853);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.sb{display:none;flex-basis:100%;order:3;max-width:620px;margin:0 auto;position:relative}.sb.on{display:block}
.sb span{position:absolute;left:16px;top:10px}
.sb input{border-radius:99px;background:var(--sf);border:0;padding:11px 18px 11px 44px}
.btn{border-radius:99px;padding:8px 16px;cursor:pointer;background:none;border:1px solid var(--bd);transition:.2s;display:inline-block;text-decoration:none;color:var(--tx)}
.btn:hover{background:var(--sf)}
.btn.p{background:var(--a1);color:var(--onp);border:0;font-weight:600}
.btn.p:hover{filter:brightness(1.1)}
.btn.on{background:color-mix(in srgb,var(--a1) 18%,var(--bg));color:var(--a1);border-color:var(--a1)}
.btn.d{color:#e11d48}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;width:100%}
select{width:auto;border-radius:99px;background:var(--sf);border:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px}
.chip{white-space:nowrap;border-radius:10px;padding:7px 16px;border:1px solid var(--bd);background:none;cursor:pointer}
.chip.on{background:color-mix(in srgb,var(--a1) 18%,var(--bg));color:var(--a1);border-color:transparent;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;flex-wrap:wrap}
.bar h2{font-size:20px;font-weight:500;margin-right:auto}
.views{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.views .btn{padding:5px 12px;font-size:13px;white-space:nowrap}
main{padding:12px 16px 60px;max-width:1500px;margin:auto}
#grid{display:grid;gap:22px 16px}
.card{cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.card:hover .ic{transform:scale(1.06)}
.ban{display:none;height:170px;border-radius:16px;background-size:cover}
.meta{display:flex;gap:12px;align-items:center;min-width:0}
.ic{width:56px;height:56px;border-radius:22%;display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none;box-shadow:var(--sh);transition:.2s}
.ic img{width:100%;height:100%;object-fit:cover}
.inf{min-width:0;flex:1}.inf h3{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub,.inf p{font-size:12.5px;color:var(--mut)}
.tag{color:var(--a1);font-weight:500}
.inf p{display:none}
.v-big{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.v-big .ban{display:block}
.v-small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.v-small .meta{flex-direction:column;align-items:flex-start;gap:8px}.v-small .ic{width:100%;height:auto;aspect-ratio:1;font-size:44px}.v-small .inf{width:100%}
.v-list{grid-template-columns:1fr}.v-list .ic{width:72px;height:72px;font-size:38px}.v-list .inf p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.v-list .card{border-bottom:1px solid var(--bd);padding-bottom:14px}
.v-compact{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 16px}.v-compact .ic{width:44px;height:44px;font-size:24px}
.v-icons{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.v-icons .meta{flex-direction:column;text-align:center;gap:6px}.v-icons .ic{width:68px;height:68px;font-size:36px}.v-icons .sub{display:none}.v-icons .inf{width:100%}
.v-mosaic{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));grid-auto-rows:210px;gap:12px}.v-mosaic .card{position:relative;border-radius:16px;overflow:hidden}.v-mosaic .card:nth-child(5n+1){grid-row:span 2}.v-mosaic .ban{display:block;position:absolute;inset:0;height:auto;border-radius:0}.v-mosaic .meta{position:relative;margin-top:auto;padding:36px 12px 12px;background:linear-gradient(transparent,#000c);color:#fff}.v-mosaic .sub,.v-mosaic .tag{color:#ddd}
.empty{text-align:center;color:var(--mut);padding:60px}
.ov{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.mod{background:var(--bg);border-radius:28px;max-width:960px;width:100%;max-height:94vh;overflow:auto;padding:24px;position:relative}
.x{position:absolute;right:14px;top:14px;padding:6px 12px}
.hd{display:flex;gap:18px;align-items:center;margin-bottom:16px;padding-right:44px}
.hd .ic{width:96px;height:96px;font-size:52px}.hd h2{font-size:26px;font-weight:500}
.go{display:block;width:100%;max-width:360px;text-align:center;padding:12px}
.seg{display:flex;border-bottom:1px solid var(--bd);margin:18px 0 8px}
.tab{background:none;border:0;padding:10px 18px;border-bottom:3px solid transparent;color:var(--mut);cursor:pointer;font-weight:500}
.tab.on{color:var(--a1);border-color:var(--a1)}
.gal{display:flex;gap:10px;overflow-x:auto;padding:8px 0;scroll-snap-type:x mandatory}
.gal img{border-radius:14px;scroll-snap-align:start;flex:none;max-height:400px;max-width:92%}
.gal.m img{max-height:480px;border-radius:20px}
.txt{white-space:pre-wrap;margin-top:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.f{display:grid;gap:10px}.f label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{display:flex;gap:8px;flex-wrap:wrap}.th div{position:relative}.th img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.th b{position:absolute;top:-6px;right:-6px;background:#e11d48;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-size:13px}
.al{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:14px;margin-bottom:6px}
.al .ic{width:44px;height:44px;font-size:24px}.al span{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:99;display:none}
.nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sf);justify-content:space-around;padding:8px 0 10px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);cursor:pointer;padding:2px 20px}.nav button span{font-size:20px}
@media(max-width:700px){.nav{display:flex}#admBtn{display:none}main{padding-bottom:90px}header{flex-wrap:wrap}.sb{order:3;flex-basis:100%;max-width:none}.ov{padding:0}.mod{height:100%;max-height:100%;border-radius:0}.g2{grid-template-columns:1fr}.hd .ic{width:76px;height:76px}.toast{bottom:80px}.go{max-width:none}.v-big{grid-template-columns:1fr}}
.hi{display:flex;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:none;font-size:20px;cursor:pointer}
.ib:hover,.ib.on{background:var(--sf)}
.pop{position:fixed;top:62px;right:12px;z-index:40;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 8px 28px #0004;padding:6px;min-width:220px;display:none}
.pop.on{display:block}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--sf)}.mi.on{color:var(--a1);font-weight:600;background:color-mix(in srgb,var(--a1) 15%,var(--card))}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:10px;vertical-align:-2px;border:1px solid var(--bd)}
.sv{vertical-align:-3px}.ib svg{display:block;margin:auto}

/* ===== Modernización ===== */
*{scrollbar-width:thin}
body{font-family:Inter,"Google Sans",Roboto,system-ui,sans-serif;letter-spacing:-.005em;background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--a1) 16%,transparent),transparent),radial-gradient(700px 420px at -8% 6%,color-mix(in srgb,var(--a2) 14%,transparent),transparent),var(--bg);background-attachment:fixed}
header{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid color-mix(in srgb,var(--bd) 55%,transparent)}
.logo{font-weight:700;letter-spacing:-.02em}
.logo i{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onp);border-radius:11px;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--a1) 60%,transparent)}
.ib{width:44px;height:44px;border-radius:14px;color:var(--tx);transition:.2s}
.ib:hover,.ib.on{background:var(--sf);transform:translateY(-1px)}
.sb input{background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);padding:13px 18px 13px 46px;animation:up .25s}
.hero{max-width:1500px;margin:auto;padding:30px 16px 6px}
.hero h1{font-size:clamp(28px,5.5vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.1;background:linear-gradient(100deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.hero p{color:var(--mut);margin-top:8px}
.chips{max-width:1500px;margin:auto;padding:14px 16px 10px;scrollbar-width:none}
.chip{border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);transition:.2s}
.chip:hover{transform:translateY(-1px);border-color:var(--a1)}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onp);border-color:transparent;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--a1) 70%,transparent)}
.btn{transition:.2s}
.btn.p{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 20px -8px color-mix(in srgb,var(--a1) 75%,transparent)}
.btn.p:hover{transform:translateY(-2px);filter:brightness(1.08);background:linear-gradient(135deg,var(--a1),var(--a2))}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes pp{from{opacity:0;transform:translateY(26px) scale(.97)}}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:24px;padding:10px;box-shadow:var(--sh);animation:up .55s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 44px -16px color-mix(in srgb,var(--a1) 45%,transparent)}
.ban{border-radius:18px;position:relative;overflow:hidden}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#0003)}
.ic{border-radius:24%;box-shadow:0 10px 22px -8px #0006}
.inf h3{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.tag{background:color-mix(in srgb,var(--a1) 14%,transparent);padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.v-list .card{padding:14px}.v-compact .card{padding:8px 12px;border-radius:18px}.v-icons .card{padding:14px 6px}
.v-mosaic .card{padding:0;border:0;border-radius:24px}.v-mosaic .tag{background:#fff3;color:#fff}
.v-mosaic .card:hover .ban{transform:scale(1.06)}.v-mosaic .ban{transition:transform .5s}
.empty{border:2px dashed var(--bd);border-radius:24px;margin:20px 0}
.pop{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:8px;animation:pp .2s;box-shadow:0 24px 60px -12px #0006}
.mi{border-radius:12px;padding:11px 14px}
.ov{background:rgba(10,10,28,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mod{border-radius:32px;padding:28px;animation:pp .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 40px 100px -20px #000a}
.hd h2{font-weight:700;letter-spacing:-.025em;font-size:28px}.hd .ic{border-radius:26%}
.x{border-radius:50%;width:38px;height:38px;padding:0;background:var(--sf);border:0}
.seg{display:inline-flex;background:var(--sf);border:0;border-radius:99px;padding:4px;margin:20px 0 10px}
.tab{border:0;border-radius:99px;padding:8px 20px;transition:.2s}
.tab.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.gal img{border-radius:20px;box-shadow:0 14px 30px -14px #0007;transition:transform .3s}.gal img:hover{transform:scale(1.02)}
.gal.m img{border-radius:28px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--a1) 55%,transparent);outline-offset:1px}
.al{border-radius:18px;background:var(--card);box-shadow:var(--sh)}
.toast{border-radius:99px;box-shadow:0 12px 30px -8px #0008;padding:12px 22px}
@media(max-width:700px){.hero{padding-top:18px}.mod{border-radius:0;padding:20px}.chips{padding-top:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Arreglo administración móvil ===== */
.mod{min-width:0;max-width:min(960px,100%);overflow-x:hidden}
.mod *{min-width:0}
.f>*,.g2>*{min-width:0}
.al{flex-wrap:wrap;gap:8px 10px}
.al span{flex:1 1 130px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.acts .btn,.al>.btn{padding:6px 13px;font-size:13px}
#adm .row .btn{padding:9px 16px;font-size:14px}
#adm .row label.btn{cursor:pointer}
#adm .row label:not(.btn){display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);margin:0;font-size:14px;color:var(--tx);font-weight:500}
#adm input[type=checkbox]{width:18px;height:18px;accent-color:var(--a1);padding:0}
#adm input[type=file]{padding:6px;font-size:13px}
#adm input[type=file]::file-selector-button{border:0;border-radius:99px;padding:7px 14px;margin-right:10px;background:var(--sf);color:var(--tx);cursor:pointer}
#adm details{border:1px solid var(--bd);border-radius:18px;padding:12px 14px;background:var(--card)}
#adm summary{cursor:pointer;font-weight:600}
#adm .f .row{margin-top:6px}
@media(max-width:700px){#adm .row{gap:8px}#adm .row>.btn{flex:1 1 calc(50% - 8px);text-align:center}.hd h2,#adm h2{font-size:24px}.acts{width:100%;margin-left:0}.acts .btn{flex:1;text-align:center}}

/* ===== Galería de la ficha ===== */
.gal{gap:22px;padding:10px 2px 16px;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.gal img{scroll-snap-align:start;scroll-snap-stop:always;max-width:88%}
.gal.m img{max-width:70%}
.seg .tab{padding:9px 24px;display:inline-flex;align-items:center}
.seg .tab .sv{width:20px;height:20px;vertical-align:0}
.hd .sub{display:flex;gap:10px}

/* ===== Iconos de dispositivo ===== */
.dv{display:inline-flex;gap:10px;vertical-align:middle;align-items:center}
.dv .off{color:#e11d48}
.card .dv{margin-left:8px;gap:6px}
.hd .sub{margin-top:10px}
.gal{margin-top:14px}

/* ===== Etiqueta categoría centrada + iconos verdes ===== */
.tag{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:6px 12px;text-align:center;vertical-align:middle}
.hd .tag{padding:7px 14px}
.dv>span{color:#16a34a}
[data-theme=dark] .dv>span,[data-theme=medio] .dv>span{color:#4ade80}
.v-mosaic .dv>span{color:#86efac}
[data-theme] .dv>span.off{color:#e11d48}
[data-theme=dark] .dv>span.off,[data-theme=medio] .dv>span.off,.v-mosaic .dv>span.off{color:#fb7185}

/* ===== Galería: respetar proporción de las imágenes ===== */
.gal{align-items:flex-start}
.gal img{height:auto;width:auto;object-fit:contain;flex:0 0 auto}
.gal.d img{width:88%;max-width:760px;max-height:none}
.gal.m img{width:auto;max-height:480px;max-width:70%}

/* ===== Galería: marcos uniformes ===== */
.gal img{object-fit:cover;object-position:center top;height:auto}
.gal.d img{aspect-ratio:16/10;width:88%;max-width:760px;max-height:none}
.gal.m img{aspect-ratio:9/19.5;width:min(280px,66%);max-width:none;max-height:none}

/* ===== Galería: marcos 16:9 y 9:20 sin recortar ===== */
.gal img{object-fit:contain;object-position:center;background:var(--sf)}
.gal.d img{aspect-ratio:16/9}
.gal.m img{aspect-ratio:9/20}

/* ===== Buscador en globo flotante ===== */
.sb{position:fixed;top:62px;right:12px;left:auto;margin:0;max-width:none;order:0;flex-basis:auto;width:min(380px,calc(100vw - 24px));padding:10px;border-radius:24px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 24px 60px -12px #0006;z-index:40;animation:pp .2s}
.sb input{background:var(--sf);border:0;box-shadow:none;padding:12px 18px 12px 46px;animation:none}
.sb span{left:28px;top:21px;color:var(--mut)}
.chips:empty{display:none}
.card .dv{margin-left:0}.tag+.dv{margin-left:8px}

/* ===== Botones panel ===== */
.btn.ok{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;font-weight:700;box-shadow:0 8px 20px -8px #16a34a}
.btn.ok:hover{background:linear-gradient(135deg,#22c55e,#16a34a);filter:brightness(1.08);transform:translateY(-2px)}
.btn.d{background:#dc2626;color:#fff;border:0;font-weight:700}
.btn.d:hover{background:#b91c1c}
.btn.ed{background:var(--sf);color:var(--tx);border:0;font-weight:700}
.btn.ed:hover{background:color-mix(in srgb,var(--sf) 82%,var(--tx))}
#adm .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
#adm .seg .tab{white-space:nowrap;padding:9px 16px;font-size:14px}

/* ===== Editor de texto + ficha ===== */
.rte{border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--card)}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px;background:var(--sf);border-bottom:1px solid var(--bd)}
.tb button{min-width:34px;height:34px;padding:0 6px;border:0;border-radius:10px;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:14px}
.tb button:hover{background:var(--bd)}
.tb select{height:34px;padding:0 10px;font-size:13px;width:auto;max-width:110px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.tb .sep{width:1px;height:22px;background:var(--bd);margin:0 3px}
.cw{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;cursor:pointer}
.cw:hover{background:var(--bd)}.cw b{pointer-events:none;font-size:15px;border-bottom:3px solid #e11d48;line-height:1}.cw b.hl{border-color:#fde047}
.cw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.edt{min-height:200px;max-height:440px;overflow:auto;padding:14px;outline:none;color:var(--tx)}
.rt h1{font-size:1.7em;font-weight:700;margin:.5em 0 .3em}.rt h2{font-size:1.4em;font-weight:700;margin:.5em 0 .3em}.rt h3{font-size:1.15em;font-weight:700;margin:.5em 0 .3em}
.rt ul,.rt ol{padding-left:1.5em;margin:.4em 0}.rt blockquote{border-left:4px solid var(--a1);padding:2px 14px;margin:.6em 0;color:var(--mut)}
.rt pre,.rt code{background:var(--sf);border-radius:8px;font-family:monospace}.rt pre{padding:10px;white-space:pre-wrap}.rt code{padding:1px 5px}
.rt a{color:var(--a1);font-weight:600}.rt hr{border:0;border-top:1px solid var(--bd);margin:.8em 0}.rt p{margin:.3em 0}
.txt{white-space:normal;color:var(--tx)}
#ipv .ic{width:56px;height:56px}
@media(min-width:900px){.gal.d img{width:440px;max-width:none}.gal.m img{width:180px}.gal{gap:16px}}
.ic.tr{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.ic.tr img{object-fit:contain;filter:drop-shadow(0 6px 10px #0004)}
#adm:not(:has(#lu)){height:min(780px,94vh)}
@media(max-width:700px){#adm:not(:has(#lu)){height:100%}}
.lg{width:38px;height:38px;object-fit:contain;flex:none}
.logo{gap:10px}.logo .sl{color:var(--c);font-weight:800}
.logo>span{font-weight:800;letter-spacing:-.02em}
.ib[hidden]{display:none}

/* ===== Logo más grande ===== */
.logo{font-size:32px;gap:14px;min-width:0;white-space:nowrap}
.lg{width:60px;height:60px}
@media(min-width:701px){.pop,.sb{top:86px}}
@media(max-width:700px){
  header{flex-wrap:nowrap;gap:6px}
  .logo{font-size:clamp(17px,5.4vw,24px);gap:8px}
  .lg{width:clamp(34px,10vw,46px);height:clamp(34px,10vw,46px)}
  .ib{width:38px;height:38px}
  .pop,.sb{top:68px}
}

/* ===== Cabecera móvil en dos filas ===== */
.pop,.sb{top:calc(var(--hh,70px) + 6px)!important}
@media(max-width:700px){
  header{flex-wrap:wrap;gap:2px 0;padding:8px 12px 6px}
  .logo{flex:1 1 100%;font-size:clamp(24px,7.4vw,32px);gap:10px;margin-right:0}
  .lg{width:clamp(44px,13vw,56px);height:clamp(44px,13vw,56px)}
  .hi{flex:1 1 100%;justify-content:space-around}
  .ib{width:44px;height:44px}
}

/* ===== Cabecera: logo + buscar + ajustes ===== */
@media(max-width:700px){
  header{flex-wrap:nowrap;gap:6px;padding:8px 12px}
  .hi{flex:0 0 auto;justify-content:flex-end}
  .logo{flex:1 1 auto;min-width:0;font-size:clamp(22px,6.8vw,32px)}
  .lg{width:clamp(42px,12.5vw,56px);height:clamp(42px,12.5vw,56px)}
}

/* ===== Panel: pestañas y botones principales ===== */
#adm .seg .tab{flex:0 0 auto}
#adm .row>.btn,#adm .row>label.btn{border-radius:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:44px;font-weight:700}
@media(max-width:700px){
  #adm .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:22px;width:100%;overflow:visible}
  #adm .seg .tab{width:100%;padding:10px 8px;text-align:center;justify-content:center;font-size:14px}
  #adm .row>.btn,#adm .row>label.btn{flex:1 1 100%}
}

/* ===== Pantalla de edición de aplicación ===== */
.eh{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.eh h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.eh .btn{padding:8px 16px;white-space:nowrap;font-weight:600}
#adm .f>.row:last-child{position:sticky;bottom:-24px;z-index:3;margin:6px -4px 0;padding:12px 4px;background:var(--bg);border-top:1px solid var(--bd)}
@media(max-width:700px){#adm .f>.row:last-child{bottom:-20px}}

/* ===== Diálogos integrados ===== */
@keyframes fade{from{opacity:0}}
.dgo{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .15s}
.dlg{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:28px;padding:26px 24px 22px;width:min(420px,100%);box-shadow:0 40px 100px -20px #000b;animation:pp .25s cubic-bezier(.2,.8,.2,1)}
.dlg h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.dlg p{color:var(--mut);margin:8px 0 18px}
.dlg input{margin:-4px 0 18px}
.dact{display:flex;gap:10px;justify-content:flex-end}
.dact .btn{min-height:46px;padding:10px 22px;border-radius:14px;font-weight:700}
@media(max-width:700px){.dact .btn{flex:1}}

<body data-theme="light">
<header>
  <div class="logo"><img class="lg" src="icon-192.png" alt=""><span>Store <span class="sl" style="--c:#ef4444">S</span><span class="sl" style="--c:#f97316">t</span><span class="sl" style="--c:#eab308">u</span><span class="sl" style="--c:#22c55e">d</span><span class="sl" style="--c:#06b6d4">i</span><span class="sl" style="--c:#a855f7">o</span></span></div>
  <div class="hi">
    <button class="ib" id="bS" title="Buscar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ib" id="bG" title="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <div class="sb" id="sb"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><input id="q" type="search" placeholder="Buscar aplicaciones"></div>
</header>
<div class="pop" id="pG"></div>
<div class="chips" id="chips"></div>
<main><div id="grid" class="v-big"></div></main>

<div class="ov" id="ovD"><div class="mod" id="det"></div></div>
<div class="ov" id="ovA"><div class="mod" id="adm"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VIEWS=[['big','Cuadrícula grande'],['small','Cuadrícula pequeña'],['list','Lista'],['compact','Compacta'],['icons','Iconos'],['mosaic','Mosaico']];
const GRADS=['#6c5ce7,#ff6b9d','#00c2ff,#6c5ce7','#ff9f43,#ff6b9d','#10b981,#00c2ff','#f43f5e,#f59e0b','#8b5cf6,#22d3ee'];
let apps=[],cfg=JSON.parse(localStorage.getItem('tienda_cfg')||'{"repo":"","branch":"main","path":"apps.json","token":""}');cfg.token='';
let cat='Todas',view=localStorage.getItem('tienda_view')||'big',ed=null;
const save=()=>localStorage.setItem('tienda_cfg',JSON.stringify({...cfg,token:''}));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}

async function load(){
  baseSig='none';try{const r=await fetch(cfg.path+'?t='+Date.now(),{cache:'no-store'});const t=await r.text();baseSig=sigOf(t);const j=JSON.parse(t);apps=j.apps||[];admins=j.admins||[];vault=j.vault||{tk:{}}}catch(e){apps=[]}
  if(localStorage.getItem('tienda_base')!=baseSig)['tienda_draft','tienda_admins','tienda_vault'].forEach(k=>localStorage.removeItem(k));
  try{const x=JSON.parse(localStorage.getItem('tienda_admins'));if(x)admins=x}catch(e){}try{const v=JSON.parse(localStorage.getItem('tienda_vault'));if(v)vault=v}catch(e){}vault.tk=vault.tk||{};if(vault.repo){cfg.repo=vault.repo;cfg.branch=vault.branch||'main'}
  const d=localStorage.getItem('tienda_draft');if(d){try{apps=JSON.parse(d)}catch(e){}}
  if(!apps.length)apps=[{id:'demo',name:'App de ejemplo',url:'#',cat:'Ejemplos',icon:'',desc:'Añade tus apps desde Administración.',text:'Esta es una ficha de ejemplo.',color:0,desk:true,mob:true,imgD:[],imgM:[]}];
  render();
}
const draft=()=>{localStorage.setItem('tienda_draft',JSON.stringify(apps));localStorage.setItem('tienda_base',baseSig)};

function iconHtml(a){const i=a.icon||'';return /^(data:|https?:|img\/)/.test(i)?`<div class="ic${/\.(png|webp)$|^data:image\/(png|webp)/.test(i)?' tr':''}"><img src="${esc(U(i))}"></div>`:`<div class="ic" style="background:linear-gradient(135deg,${GRADS[(a.color||0)%GRADS.length]});color:#fff">${esc(i||(a.name||'?')[0].toUpperCase())}</div>`}
function render(){
    const cats=['Todas',...new Set(apps.map(a=>a.cat).filter(Boolean))];
  if(!cats.includes(cat))cat='Todas';
  $('#chips').innerHTML=cats.length<2?'':cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const q=$('#q').value.toLowerCase();
  const l=apps.filter(a=>(cat=='Todas'||a.cat==cat)&&(a.name+a.desc+a.cat).toLowerCase().includes(q));
  const g=$('#grid');g.className='v-'+view;
  g.innerHTML=l.length?l.map((a,n)=>{
    const cover=(a.imgD&&a.imgD[0])||(a.imgM&&a.imgM[0]);const bg=cover?`url(${U(cover)}) center/cover`:`linear-gradient(135deg,${GRADS[(a.color||0)%GRADS.length]})`;return `<article class="card" data-id="${esc(a.id)}" style="animation-delay:${Math.min(n,14)*35}ms"><div class="ban" style="background:${bg}"></div><div class="meta">${iconHtml(a)}<div class="inf"><h3>${esc(a.name)}</h3><div class="sub">${a.cat?`<span class="tag">${esc(a.cat)}</span>`:''} ${devIc(a)}</div><p>${esc(a.desc)}</p></div></div></article>`}).join(''):'<div class="empty">No hay aplicaciones todavía </div>';
}
$('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};
$('#q').oninput=render;

/* Ficha */
let dev='d';
function openDet(id){
  const a=apps.find(x=>x.id==id);if(!a)return;
  const hd=a.desk!==false&&(a.imgD||[]).length>0,hm=a.mob!==false&&(a.imgM||[]).length>0;dev=hm?'m':hd?'d':(a.mob!==false?'m':'d');
  const draw=()=>{
    const imgs=(dev=='d'?a.imgD:a.imgM)||[];
    $('#det').innerHTML=`<button class="btn x" data-close>✕</button>
    <div class="hd">${iconHtml(a)}<div><h2>${esc(a.name)}</h2>${a.cat?`<div class="tag" style="font-size:15px">${esc(a.cat)}</div>`:''}<div class="sub">${devIc(a)}</div></div></div>
    ${a.url&&a.url!='#'?`<a class="btn p go" href="${esc(a.url)}" target="_blank" rel="noopener">▶ Abrir aplicación</a>`:''}
    ${hd&&hm?'<div class="seg">':'<div hidden>'}${a.mob!==false?`<button class="tab ${dev=='m'?'on':''}" data-dev="m" title="Móvil" aria-label="Móvil">${I.m}</button>`:''}${a.desk!==false?`<button class="tab ${dev=='d'?'on':''}" data-dev="d" title="Ordenador" aria-label="Ordenador">${I.d}</button>`:''}</div>
    <div class="gal ${dev}">${imgs.length?imgs.map(i=>`<img src="${U(i)}" loading="lazy">`).join(''):'<div class="empty">Sin imágenes para esta versión</div>'}</div>
    <h3 style="margin-top:18px;font-weight:500">Acerca de esta app →</h3><p style="margin-top:6px">${esc(a.desc)}</p><div class="txt rt">${textHtml(a.text)}</div>`;
    $('#det').querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{dev=b.dataset.dev;draw()});
  };
  draw();$('#ovD').classList.add('on');
}
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openDet(c.dataset.id)};
document.addEventListener('click',e=>{if(e.target.closest('[data-close]')||(e.target.classList.contains('ov')&&!(e.target.id=='ovA'&&ed)))document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))});

/* Administración */
function compress(file,max,icon){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,max/(icon?Math.max(im.width,im.height):im.width)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let out;
  if(icon){let a=false;const d=x.getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]<250){a=true;break}
    if(a){out=c.toDataURL('image/webp',.9);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/png')}else out=c.toDataURL('image/jpeg',.85)}
  else out=c.toDataURL('image/jpeg',.78);
  res(out)};im.src=r.result};r.readAsDataURL(file)})}
function thumbs(k){return ed[k].map((s,i)=>`<div><img src="${U(s)}"><b data-rm="${k}:${i}">×</b></div>`).join('')}
function admApps(){
  const e=ed;
  $('#adm').innerHTML=`${e&&tab=='a'?`<div class="eh"><h2>${apps.some(a=>a.id==e.id)?'Editar aplicación':'Nueva aplicación'}</h2></div>`:`<button class="btn x" data-close>✕</button><h2>Edición</h2>${tabsHtml()}`}`+(tab=='r'?`
  <div class="f" style="margin-top:12px"><h3 style="font-weight:500">Copia de seguridad</h3>
   <small style="color:var(--mut)">Exporta todos los datos (aplicaciones, administradores y conexión cifrada) a un archivo JSON, o restáuralos desde uno.</small>
   <div class="row"><button class="btn p" id="exp">Exportar</button><label class="btn">Importar<input type="file" id="imp" accept=".json" hidden></label></div>
   <small style="color:var(--mut)">Tras importar, pulsa «Publicar en GitHub» en la pestaña Aplicaciones para guardarlo en la nube.</small></div>`:tab=='n'?`
  <div class="f" style="margin-top:12px"><h3 style="font-weight:500">Conexión con GitHub</h3>
   <div class="g2"><div><label>Repositorio (usuario/repo)</label><input id="cr" value="${esc(cfg.repo)}"></div><div><label>Rama</label><input id="cb" value="${esc(cfg.branch)}"></div></div>
   <div class="g2"><div><label>Archivo de datos</label><input id="cp" value="${esc(cfg.path)}"></div><div><label>Token personal (permiso Contents: write)</label><input id="ct" type="password" value="${esc(cfg.token)}"></div></div>
   <button class="btn p" id="cs">Guardar conexión</button><small style="color:var(--mut)">El token se guarda cifrado con tu contraseña dentro de apps.json (hace falta contraseña de 10 o más caracteres) y se descifra al iniciar sesión en cualquier dispositivo. Publica para que quede en la nube.</small></div>`:e?`
  <div class="f" style="margin-top:12px">
   <div class="g2"><div><label>Nombre</label><input id="fn" value="${esc(e.name)}"></div><div><label>Categoría</label><input id="fc" value="${esc(e.cat)}"></div></div>
   <div><label>URL de la app (GitHub Pages)</label><input id="fu" value="${esc(e.url)}" placeholder="https://usuario.github.io/app/"></div>
   <div class="row"><div id="ipv">${iconHtml(e)}</div><small style="color:var(--mut)">${e.icon?'Icono actual':'Sin icono (se mostrará la inicial)'}</small>${e.icon?'<button type="button" class="btn" id="irm">Quitar icono</button>':''}</div>
    <div class="g2"><div><label>Icono (emoji o URL)</label><input id="fi" value="${/^(data:|img\/)/.test(e.icon)?'':esc(e.icon)}" placeholder="🎮"></div><div><label>…o subir imagen de icono</label><input type="file" id="fif" accept="image/*"></div></div>
   <div><label>Descripción corta</label><input id="fd" value="${esc(e.desc)}"></div>
   <div><label>Texto completo</label><div class="rte">${rteBar()}<div class="edt rt" id="ft" contenteditable="true">${textHtml(e.text)}</div></div></div>
   <div><label>Color de portada</label><select id="fcol">${GRADS.map((g,i)=>`<option value="${i}" ${e.color==i?'selected':''}>Degradado ${i+1}</option>`).join('')}</select></div>
   <div class="row"><label><input type="checkbox" id="fmb" ${e.mob!==false?'checked':''} style="width:auto"> ${I.m} Versión móvil</label><label><input type="checkbox" id="fdk" ${e.desk!==false?'checked':''} style="width:auto"> ${I.d} Versión ordenador</label></div>
   <div><label>${I.m} Imágenes móvil</label><input type="file" id="fim" accept="image/*" multiple><div class="th" style="margin-top:6px">${thumbs('imgM')}</div></div>
   <div><label>${I.d} Imágenes ordenador</label><input type="file" id="fid" accept="image/*" multiple><div class="th" style="margin-top:6px">${thumbs('imgD')}</div></div>
   <div class="row"><button class="btn p" id="sv">Guardar ficha</button><button class="btn" id="cn">Cancelar</button></div></div>`:`
  <div class="row" style="margin-top:12px"><button class="btn p" id="nw">Nueva aplicación</button><button class="btn ok" id="pub">Publicar en GitHub</button><button class="btn" id="lo">Salir</button></div>
  <div style="margin:10px 0">${apps.map((a,i)=>`<div class="al">${iconHtml(a)}<span><b>${esc(a.name)}</b><br><small>${esc(a.cat)}</small></span><div class="acts"><button class="btn" data-up="${i}">↑</button><button class="btn ed" data-ed="${i}">Editar</button><button class="btn d" data-del="${i}">Borrar</button></div></div>`).join('')}</div>`);
  const A=$('#adm'),on=(s,f)=>{const x=A.querySelector(s);if(x)x.onclick=f};
  on('#nw',()=>{edSnap=null;ed={id:'a'+Date.now(),name:'',cat:'',url:'',icon:'',desc:'',text:'',color:0,desk:true,mob:true,imgD:[],imgM:[]};admRender()});
  on('#cn',async()=>{keep();if(JSON.stringify(ed)!=edSnap&&!await ask('Si sales ahora, se perderán los cambios que no hayas guardado.',{title:'¿Descartar los cambios?',ok:'Descartar',cancel:'Seguir editando',danger:true}))return;ed=null;edSnap=null;admRender()});
  on('#sv',()=>{if(!$('#fn').value.trim())return toast('Falta el nombre');
    Object.assign(ed,{name:$('#fn').value.trim(),cat:$('#fc').value.trim(),url:$('#fu').value.trim(),desc:$('#fd').value,text:clean($('#ft').innerHTML),color:+$('#fcol').value,desk:$('#fdk').checked,mob:$('#fmb').checked});
    if($('#fi').value.trim())ed.icon=$('#fi').value.trim();
    const i=apps.findIndex(a=>a.id==ed.id);i<0?apps.push(ed):apps[i]=ed;
    apps=apps.filter(a=>a.id!='demo'||apps.length==1);draft();ed=null;admRender();render();toast('Guardado (pendiente de publicar)')});
  const up=(s,k,max)=>{const x=A.querySelector(s);if(x)x.onchange=async()=>{for(const f of x.files){toast('Subiendo imagen…');ed[k].push(await store(await compress(f,max),ed.id))};keep();admRender()}};
  const keep=()=>{Object.assign(ed,{name:$('#fn').value,cat:$('#fc').value,url:$('#fu').value,desc:$('#fd').value,text:clean($('#ft').innerHTML),color:+$('#fcol').value,desk:$('#fdk').checked,mob:$('#fmb').checked});if($('#fi').value.trim())ed.icon=$('#fi').value.trim()};
  up('#fid','imgD',1000);up('#fim','imgM',600);
  const fi=A.querySelector('#fif');if(fi)fi.onchange=async()=>{keep();ed.icon=await store(await compress(fi.files[0],128,true),ed.id);admRender();toast('Icono subido')};
  const fie=$('#fi');if(fie)fie.oninput=()=>{ed.icon=fie.value.trim();$('#ipv').innerHTML=iconHtml({...ed,name:$('#fn').value})};
  on('#irm',()=>{keep();ed.icon='';admRender()});
  const ft=$('#ft');if(ft){
    let saved=null;
    const saveSel=()=>{const g=getSelection();if(g.rangeCount&&ft.contains(g.anchorNode))saved=g.getRangeAt(0).cloneRange()};
    ['keyup','mouseup','input','blur'].forEach(v=>ft.addEventListener(v,saveSel));
    const ex=(c,v)=>{ft.focus();if(saved){const g=getSelection();g.removeAllRanges();g.addRange(saved)}document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v||null);saveSel()};
    ft.onpaste=ev=>{ev.preventDefault();const h=ev.clipboardData.getData('text/html'),t=ev.clipboardData.getData('text/plain');document.execCommand('insertHTML',false,h?clean(h):esc(t).replace(/\n/g,'<br>'))};
    A.querySelectorAll('.tb [data-c]').forEach(b=>{b.onmousedown=ev=>ev.preventDefault();b.onclick=async()=>{const c=b.dataset.c;if(c=='link'){const u=await ask('Escribe la dirección completa del enlace.',{title:'Insertar enlace',input:true,ph:'https://…',ok:'Insertar'});if(u)ex('createLink',u)}else ex(c)}});
    A.querySelectorAll('.tb select').forEach(sl=>sl.onchange=()=>{if(!sl.value)return;ex(sl.dataset.s,sl.dataset.s=='formatBlock'?'<'+sl.value+'>':sl.value);sl.selectedIndex=0});
    A.querySelectorAll('.tb input[type=color]').forEach(ci=>ci.oninput=()=>ex(ci.dataset.k,ci.value));
  }

function clean(h){
  const d=new DOMParser().parseFromString('<body>'+(h||''),'text/html').body;
  (function w(n){[...n.childNodes].forEach(c=>{
    if(c.nodeType==3)return;
    if(c.nodeType!=1){c.remove();return}
    if(!OKT.has(c.tagName)){
      if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE|FORM|INPUT|BUTTON)$/.test(c.tagName)){c.remove();return}
      w(c);c.replaceWith(...c.childNodes);return}

    [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    const o=[];st.split(';').forEach(p=>{const i=p.indexOf(':');if(i<0)return;const k=p.slice(0,i).trim().toLowerCase(),v=p.slice(i+1).trim();if(OKS.has(k)&&/^[#\w\s,.%()'"-]+$/.test(v)&&!/url|expr/i.test(v))o.push(k+':'+v)});
    if(o.length)c.setAttribute('style',o.join(';'));
    if(c.tagName=='A'&&/^(https?:|mailto:)/i.test(href)){c.setAttribute('href',href);c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer')}
